<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1 class="brand">Omega<strong>Invest</strong></h1>
      <p>Acesse sua conta para gerenciar seus investimentos</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submitLogin.emit()" class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input
          id="email"
          formControlName="email"
          type="email"
          placeholder="Digite seu e-mail"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          id="password"
          formControlName="password"
          type="password"
          placeholder="Digite sua senha"
          [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="form.invalid || loading">
        {{ loading ? 'Autenticando...' : 'Entrar' }}
      </button>

      @if (message) {
        <p class="error-msg">{{ message }}</p>
      }
    </form>

    <div class="login-footer">
      <a href="#">Esqueceu a senha?</a>
    </div>
  </div>
</div>
